# Redis Sentinel Configuration

port 26379

# Monitor the master
sentinel monitor trading_master redis-master 6379 2

# Authentication (if needed)
# sentinel auth-pass trading_master your_password

# Failover timings
sentinel down-after-milliseconds trading_master 5000
sentinel parallel-syncs trading_master 1
sentinel failover-timeout trading_master 10000

# Notification scripts (optional)
# sentinel notification-script trading_master /path/to/notify.sh
# sentinel client-reconfig-script trading_master /path/to/reconfig.sh

# Deny scripts (security)
sentinel deny-scripts-reconfig yes

# Log level
loglevel notice
