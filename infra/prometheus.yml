global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'trading-system'
    env: 'development'

# Load alert rules
rule_files:
  - 'prometheus_alerts.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Trading system services
  - job_name: 'trading-system'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9108']
        labels:
          service: 'TradingSystem'
          env: 'development'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'execution-service'
    static_configs:
      - targets: []  # To be filled when service is deployed
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'strategy-engine'
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'market-data-aggregator'
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'risk-service'
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'portfolio-service'
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Infrastructure monitoring
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['host.docker.internal:9308']

  - job_name: 'clickhouse-exporter'
    static_configs:
      - targets: []  # Add clickhouse_exporter when deployed

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['host.docker.internal:9121']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
