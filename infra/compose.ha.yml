version: '3.8'

# Production HA/DR Configuration
# - PostgreSQL: 1 primary + 2 replicas with streaming replication
# - ClickHouse: 3-node cluster with replication
# - Kafka: 3 brokers with replication_factor=3
# - Redis: Sentinel for HA failover

services:
  # =========================================================================
  # PostgreSQL HA with Streaming Replication
  # =========================================================================

  postgres-primary:
    image: postgres:16-alpine
    container_name: trading_postgres_primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-test}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pass}
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./init/sql/pg_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./init/sql/pg_ddl.sql:/docker-entrypoint-initdb.d/02_ddl.sql
      - ./init/pg_primary_setup.sh:/docker-entrypoint-initdb.d/03_replication_setup.sh
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c archive_mode=on
      -c archive_command='/bin/true'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-test}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  postgres-replica1:
    image: postgres:16-alpine
    container_name: trading_postgres_replica1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
    command: |
      bash -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        until pg_basebackup -h postgres-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R; do
          echo 'Waiting for primary to be ready...'
          sleep 2
        done
      fi
      postgres -c hot_standby=on
      "
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  postgres-replica2:
    image: postgres:16-alpine
    container_name: trading_postgres_replica2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    command: |
      bash -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        until pg_basebackup -h postgres-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R; do
          echo 'Waiting for primary to be ready...'
          sleep 2
        done
      fi
      postgres -c hot_standby=on
      "
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  # =========================================================================
  # ClickHouse Cluster (3 nodes with replication)
  # =========================================================================

  clickhouse-01:
    image: clickhouse/clickhouse-server:latest
    container_name: trading_clickhouse_01
    hostname: clickhouse-01
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_01_data:/var/lib/clickhouse
      - ./init/ch_cluster_config.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./init/sql/ch_init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trading}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  clickhouse-02:
    image: clickhouse/clickhouse-server:latest
    container_name: trading_clickhouse_02
    hostname: clickhouse-02
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ch_02_data:/var/lib/clickhouse
      - ./init/ch_cluster_config.xml:/etc/clickhouse-server/config.d/cluster.xml
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trading}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  clickhouse-03:
    image: clickhouse/clickhouse-server:latest
    container_name: trading_clickhouse_03
    hostname: clickhouse-03
    ports:
      - "8125:8123"
      - "9002:9000"
    volumes:
      - ch_03_data:/var/lib/clickhouse
      - ./init/ch_cluster_config.xml:/etc/clickhouse-server/config.d/cluster.xml
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trading}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  # =========================================================================
  # Kafka Cluster (3 brokers with replication)
  # =========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trading_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trading_kafka_1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - trading_network

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trading_kafka_2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka-2:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - trading_network

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trading_kafka_3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9096:9096"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9096,PLAINTEXT_INTERNAL://kafka-3:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9096"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - trading_network

  # =========================================================================
  # Redis Sentinel for HA
  # =========================================================================

  redis-master:
    image: redis:7-alpine
    container_name: trading_redis_master
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    command: redis-server --appendonly yes --replica-announce-ip redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  redis-replica1:
    image: redis:7-alpine
    container_name: trading_redis_replica1
    ports:
      - "6380:6379"
    volumes:
      - redis_replica1_data:/data
    command: redis-server --appendonly yes --replicaof redis-master 6379 --replica-announce-ip redis-replica1
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trading_network

  redis-sentinel1:
    image: redis:7-alpine
    container_name: trading_redis_sentinel1
    ports:
      - "26379:26379"
    volumes:
      - ./init/sentinel.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
    networks:
      - trading_network

  redis-sentinel2:
    image: redis:7-alpine
    container_name: trading_redis_sentinel2
    ports:
      - "26380:26379"
    volumes:
      - ./init/sentinel.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
    networks:
      - trading_network

  redis-sentinel3:
    image: redis:7-alpine
    container_name: trading_redis_sentinel3
    ports:
      - "26381:26379"
    volumes:
      - ./init/sentinel.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
    networks:
      - trading_network

  # =========================================================================
  # Schema Registry (for Kafka)
  # =========================================================================

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: trading_schema_registry
    depends_on:
      kafka-1:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9093,kafka-2:9095,kafka-3:9097
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  # =========================================================================
  # Monitoring
  # =========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: trading_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trading_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: trading_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trading_network

  grafana:
    image: grafana/grafana:latest
    container_name: trading_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ../dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trading_network

volumes:
  # PostgreSQL
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:

  # ClickHouse
  ch_01_data:
  ch_02_data:
  ch_03_data:

  # Kafka
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  zk_data:
  zk_logs:

  # Redis
  redis_master_data:
  redis_replica1_data:

  # Monitoring
  prom_data:
  alertmanager_data:
  grafana_data:

networks:
  trading_network:
    driver: bridge
