  apply_params: ''
  rl_train: venv/bin/python rl_core/train.py --symbols TSLA,AAPL,NVDA --start '2025-07-01
    09:30:00' --end '2025-08-31 16:00:00' --features-table trading.features_1m --timesteps
    200000 --cost-bps 2.0 --dd-penalty 0.1 --turnover-penalty 0.05 --out models/rl/sac_position_manager_latest
  rl_eval: venv/bin/python scripts/ai_trader/rl/eval_rl.py --symbols TSLA,AAPL,NVDA
    --start '2025-07-01 09:30:00' --end '2025-08-31 16:00:00' --out-dir runs/ai_trader
  premarket_sh: ./llm_trader/run_premarket.sh
  first_hour_sh: ./llm_trader/run_first_hour.sh
  all_providers_sh: ./llm_trader/run_all_providers.sh market
  premarket_fallback: venv/bin/python llm_trader/run_single_bot.py --provider deepseek_nvidia
    --symbols TSLA --interval 600 --cycles 33 --close-at 09:35 --forbid-new-positions-before
    9 --wait-for-premarket
  first_hour_fallback: venv/bin/python llm_trader/run_single_bot.py --provider deepseek
    --symbols TSLA --interval 300 --wait-for-market --start-trading-at 9:40 --stop-trading-at
    10:30 --close-at 10:45
  overnight_fallback: venv/bin/python llm_trader/run_single_bot.py --provider deepseek_nvidia
    --symbols TSLA --interval 600 --cycles 50 --wait-for-overnight --close-at 03:50
    --forbid-new-positions-before 5
