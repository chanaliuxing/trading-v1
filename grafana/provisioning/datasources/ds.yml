apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 10s
  - name: ClickHouse
    uid: ch
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      defaultDatabase: trading
      port: 8123
      protocol: http
      host: host.docker.internal
      username: default
    secureJsonData:
      password: ""
  - name: Postgres
    uid: pg
    type: postgres
    access: proxy
    url: host.docker.internal:5432
    user: postgres
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: postgres
